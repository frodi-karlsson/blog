<article class="writing-entry" data-testid="blog-post-card">
  <div class="writing-entry__meta">
    <time>{{date}}</time>{{tags}}
  </div>
  <h2 class="writing-entry__title">
    <a href="{{url}}" data-testid="blog-post-link">{{title}}</a>
  </h2>
  <p class="writing-entry__summary">{{summary}}</p>
</article>
