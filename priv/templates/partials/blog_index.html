<div class="writing">
  <header class="writing__intro" data-testid="blog-index-header">
    <div class="writing__intro-top">
      <h1>Writing</h1>
      <a class="writing__nav-link" href="/tags" data-testid="browse-tags-link">Browse by tag →</a>
    </div>
    <p class="text-subtle">I build things to learn them. These are the write-ups.</p>
  </header>

  <form action="/" method="get" class="search-form" data-testid="search-form">
    <input
      class="search-form__input"
      type="search"
      name="q"
      placeholder="Search posts…"
      aria-label="Search posts"
      data-testid="search-input"
    />
    <button class="search-form__submit" type="submit">Search</button>
  </form>

  <div class="writing__list">
    {{items}}
  </div>
</div>
