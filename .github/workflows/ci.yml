name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Checks & Tests
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.19.5'
          otp-version: '27.2'

      - name: Restore dependencies cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-27.2-elixir-1.19.5-test-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp-27.2-elixir-1.19.5-test-mix-

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run checks
        run: mix check

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: a
      NEEDRESTART_SUSPEND: 1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.19.5'
          otp-version: '27.2'

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Install image tooling
        run: sudo apt-get update && sudo apt-get install -y libvips-tools webp

      - name: Start Webserver
        run: mix run --no-halt &
        env:
          MIX_ENV: dev
          PORT: 4040

      - name: Wait for Webserver
        run: |
          until curl -s http://localhost:4040 > /dev/null; do
            echo "Waiting for webserver..."
            sleep 2
          done

      - name: Run E2E tests
        run: mix e2e
        env:
          BASE_URL: http://localhost:4040

  docker:
    name: Docker & Security
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.69.2
          cache: true

      - name: Run Trivy vulnerability scanner
        run: trivy image ghcr.io/${{ github.repository }}:${{ github.sha }} --format table --exit-code 1 --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --ignore-unfixed

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/${{ github.repository }} --all-tags

  infrastructure:
    name: Infrastructure Analysis
    runs-on: ubuntu-latest
    env:
      # Provide dummy values to Trivy so it can evaluate the Tofu code correctly
      TF_VAR_cloudflare_token: "dummy"
      TF_VAR_cloudflare_zone_id: "dummy"
      TF_VAR_do_token: "dummy"
      TF_VAR_do_region: "fra1"
      TF_VAR_ssh_public_key_path: "id_ed25519.pub"
      TF_VAR_image_tag: "latest"
      TF_VAR_admin_username: "dummy"
      TF_VAR_admin_password: "dummy"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Create dummy SSH key for validation
        run: touch id_ed25519.pub

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2

      - name: Tofu Format Check
        run: tofu fmt -check -recursive
        working-directory: tofu

      - name: Tofu Validate
        run: tofu init -backend=false && tofu validate
        working-directory: tofu

      - name: Run Checkov (IaC)
        uses: bridgecrewio/checkov-action@a7683e7b72a04503521247973281ec8142e1ac1f # v12.3112.0
        with:
          directory: tofu
          framework: terraform
          hard_fail_on: HIGH,CRITICAL
          output_format: cli
          compact: true
